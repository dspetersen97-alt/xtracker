{% extends "base.html" %}
{% block title %}Log In - xTracker{% endblock %}

{% block header %}{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div style="text-align: center; margin-bottom: 1rem;">
    <img src="{{ url_for('static', filename='images/xTracker Logo.png') }}" alt="xTracker" style="height: 150px; width: auto;">
</div>
<article style="max-width: 420px; margin: 2rem auto;">
    <header>
        <hgroup>
            <h1>Log In</h1>
            <p>Welcome back to xTracker</p>
        </hgroup>
    </header>

    <form method="POST" action="{{ url_for('auth.login') }}">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required
               placeholder="Your username" autocomplete="username"
               value="{{ form.get('username', '') if form else '' }}">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required
               placeholder="Your password" autocomplete="current-password">

        <button type="submit" style="width: 100%;">Log In</button>
    </form>

    <footer style="text-align: center;">
        <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
    </footer>
</article>
{% endblock %}
