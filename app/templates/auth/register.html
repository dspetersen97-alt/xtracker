{% extends "base.html" %}
{% block title %}Sign Up - xTracker{% endblock %}

{% block header %}{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div style="text-align: center; margin-bottom: 1rem;">
    <img src="{{ url_for('static', filename='images/xTracker Logo.png') }}" alt="xTracker" style="height: 150px; width: auto;">
</div>
<article style="max-width: 420px; margin: 2rem auto;">
    <header>
        <hgroup>
            <h1>Create Account</h1>
            <p>Set up your xTracker profile</p>
        </hgroup>
    </header>

    <form method="POST" action="{{ url_for('auth.register') }}">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required
               placeholder="Your name" autocomplete="name"
               value="{{ form.get('name', '') if form else '' }}">

        <label for="username">Username</label>
        <input type="text" id="username" name="username" required
               placeholder="Choose a username" autocomplete="username"
               value="{{ form.get('username', '') if form else '' }}">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required
               placeholder="Choose a password" autocomplete="new-password">

        <label for="password_confirm">Confirm Password</label>
        <input type="password" id="password_confirm" name="password_confirm" required
               placeholder="Repeat your password" autocomplete="new-password">

        <button type="submit" style="width: 100%;">Create Account</button>
    </form>

    <footer style="text-align: center;">
        <p>Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
    </footer>
</article>
{% endblock %}
