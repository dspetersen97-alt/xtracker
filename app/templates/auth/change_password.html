{% extends "base.html" %}
{% block title %}Change Password - xTracker{% endblock %}

{% block content %}
<article style="max-width: 420px; margin: 2rem auto;">
    <header>
        <hgroup>
            <h1>Change Password</h1>
            <p>Update your account password</p>
        </hgroup>
    </header>

    <form method="POST" action="{{ url_for('auth.change_password') }}">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required
               placeholder="Your username" autocomplete="username"
               value="{{ form.get('username', '') if form else '' }}">

        <label for="old_password">Current Password</label>
        <input type="password" id="old_password" name="old_password" required
               placeholder="Your current password" autocomplete="current-password">

        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" required
               placeholder="Choose a new password" autocomplete="new-password">

        <label for="new_password_confirm">Confirm New Password</label>
        <input type="password" id="new_password_confirm" name="new_password_confirm" required
               placeholder="Repeat your new password" autocomplete="new-password">

        <button type="submit" style="width: 100%;">Change Password</button>
    </form>

    <footer style="text-align: center;">
        <p><a href="{{ url_for('auth.login') }}">Back to login</a></p>
    </footer>
</article>
{% endblock %}
