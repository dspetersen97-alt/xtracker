{% extends "base.html" %}
{% block title %}Settings - xTracker{% endblock %}

{% block content %}
<h1>Settings</h1>

<!-- Import Data -->
<details class="settings-section" data-section="import">
    <summary><h2 style="display: inline; font-size: 1.2rem;">Import Data</h2></summary>
    <div style="margin-top: 1rem;">
        <p>Import activities from a Garmin Connect CSV export.</p>
        <a href="{{ url_for('settings.import_page') }}" role="button" class="outline">Import CSV</a>
    </div>
</details>

<!-- Exercise Types -->
<details class="settings-section" data-section="exercise-types">
    <summary><h2 style="display: inline; font-size: 1.2rem;">Exercise Types</h2></summary>
    <div style="margin-top: 1rem;">
        <a href="{{ url_for('settings.new_exercise_type') }}" role="button" class="outline" style="margin-bottom: 1rem; display: inline-block;">
            + Add Custom Type
        </a>

        <figure>
            <table role="grid">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Skills</th>
                        <th>Fields</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for et in exercise_types %}
                    <tr>
                        <td>
                            <strong>{{ et.name | exercise_name }}</strong>
                        </td>
                        <td>
                            {% for skill, pct in et.skills_parsed.items() %}
                            <span class="badge badge-{{ skill }}" style="margin: 0 0.15rem 0.15rem 0;">{{ skill | capitalize }} {{ pct }}%</span>
                            {% else %}
                            <small>-</small>
                            {% endfor %}
                        </td>
                        <td>
                            <small>{{ et.fields | replace('[', '') | replace(']', '') | replace('"', '') }}</small>
                        </td>
                        <td>
                            {% if not et.is_default %}
                            <form method="POST" action="{{ url_for('settings.delete_type', type_id=et.id) }}"
                                  onsubmit="return confirm('Delete this exercise type?');"
                                  style="display: inline;">
                                <button type="submit" class="secondary outline" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;">
                                    Delete
                                </button>
                            </form>
                            {% else %}
                            <small>-</small>
                            {% endif %}
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </figure>
    </div>
</details>

{% endblock %}
{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    var STORAGE_KEY = 'xtracker_settings_sections';
    var sections = document.querySelectorAll('.settings-section');

    var savedState = {};
    try {
        var stored = localStorage.getItem(STORAGE_KEY);
        if (stored) savedState = JSON.parse(stored);
    } catch(e) {}

    sections.forEach(function(section) {
        var key = section.getAttribute('data-section');
        if (savedState[key] === true) {
            section.setAttribute('open', '');
        } else {
            section.removeAttribute('open');
        }
    });

    sections.forEach(function(section) {
        section.addEventListener('toggle', function() {
            var key = section.getAttribute('data-section');
            savedState[key] = section.open;
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(savedState));
            } catch(e) {}
        });
    });
});
</script>
{% endblock %}
